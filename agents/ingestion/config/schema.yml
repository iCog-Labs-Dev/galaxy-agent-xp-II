nodes:
  Workflow:
    unique: name
    fields:
      - name
      - category        # category string
      - readme          # cleaned description text
      - embedding       # vector embedding

  Tool:
    unique: name
    fields:
      - name
      - description
      - version
      - help
      - embedding       # vector embedding

  Category:
    unique: name
    fields:
      - name

  Input:
    unique: description
    fields:
      - description

  Output:
    unique: description
    fields:
      - description

  Keyword:
    unique: name
    fields:
      - name
