Category:
  label: category
  unique_key: [name]
  properties:
    name: {type: str}

Input:
  label: input
  unique_key: []
  properties:
    description: {type: str}

Output:
  label: output
  unique_key: []
  properties:
    description: {type: str}

Keyword:
  label: keyword
  unique_key: []
  properties:
    name: {type: str}