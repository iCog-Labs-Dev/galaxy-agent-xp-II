Workflow:
  label: workflow
  unique_key: [workflow_repository]
  description: "A workflow composed of tools and IO"
  properties:
    name: {type: str}
    category: {type: str}
    readme: {type: str}
    workflow_repository: {type: str}
    file_name: {type: str}
    raw_download_url: {type: str}
    number_of_steps: {type: int}
    has_readme: {type: bool}
    has_changelog: {type: bool}
    has_test_data: {type: bool}


